name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
      version: ${{ steps.admission.outputs.version }}
      published: ${{ steps.publication.outputs.published }}
    steps:
      - name: Checkout protected main workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Admit the requested release from trusted scripts
        id: admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: scripts/admit-release.sh "$RELEASE_TAG"

      - name: Verify Homebrew tap write access before building
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/verify-homebrew-tap-access.sh

      - name: Inspect existing publication
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.admission.outputs.version }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq -r --arg tag "v$VERSION" 'any(.[][]; .tag_name == $tag and .draft == false)')
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    needs: admit
    if: needs.admit.outputs.published != 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - name: Checkout admitted source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Verify version consistency
        run: |
          source scripts/release-contract.sh
          CODE_VERSION=$(buttonheist_code_version)
          if [[ "$VERSION" != "$CODE_VERSION" ]]; then
            echo "::error::Release version ($VERSION) != buttonHeistVersion ($CODE_VERSION)"
            exit 1
          fi
          scripts/validate-release-contract.sh
          echo "Version $VERSION verified against admitted source and the release contract."

      - name: Build CLI (universal)
        run: |
          cd ButtonHeistCLI
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create \
            .build/arm64-apple-macosx/release/buttonheist \
            .build/x86_64-apple-macosx/release/buttonheist \
            -output .build/buttonheist
          file .build/buttonheist

      - name: Build MCP server (universal)
        run: |
          cd ButtonHeistMCP
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create \
            .build/arm64-apple-macosx/release/buttonheist-mcp \
            .build/x86_64-apple-macosx/release/buttonheist-mcp \
            -output .build/buttonheist-mcp
          file .build/buttonheist-mcp

      - name: Build plan compiler artifacts (arm64)
        run: |
          swift build -c release --arch arm64 --target ThePlans \
            -Xswiftc -enable-library-evolution \
            -Xswiftc -emit-module-interface
          test -f .build/arm64-apple-macosx/release/Modules/ThePlans.swiftmodule
          test -f .build/arm64-apple-macosx/release/ThePlans.build/ThePlans.swiftinterface
          test -f .build/arm64-apple-macosx/release/description.json
          find .build/arm64-apple-macosx/release/ThePlans.build -name '*.swift.o' -print -quit | grep -q .

      - name: Install Tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Select iOS simulator
        run: python3 scripts/select-ios-ci-simulator.py --preferred-device "iPhone 16 Pro" --wait

      - name: Build BH Demo for iOS Simulator
        run: |
          set -eo pipefail
          ./scripts/generate-project.sh --no-binary-cache

          DERIVED_DATA_PATH="$RUNNER_TEMP/ButtonHeistDerivedData"
          DEST="platform=iOS Simulator,id=$SIM_UDID"
          echo "Building BH Demo for $DEST (iOS $SIM_OS)"
          xcodebuild -workspace ButtonHeist.xcworkspace -scheme "BH Demo" \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            build

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/BHDemo.app"
          if [[ ! -d "$APP_PATH" || ! -f "$APP_PATH/Info.plist" || ! -x "$APP_PATH/BHDemo" ]]; then
            echo "::error::BH Demo build produced an incomplete app at $APP_PATH"
            find "$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator" -maxdepth 3 -print || true
            exit 1
          fi
          APP_SIZE_KB=$(du -sk "$APP_PATH" | awk '{print $1}')
          if [[ "$APP_SIZE_KB" -lt 1024 ]]; then
            echo "::error::BH Demo app is unexpectedly small (${APP_SIZE_KB}KB): $APP_PATH"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Built: $APP_PATH (${APP_SIZE_KB}KB)"

      - name: Package prebuilt Debug iOS runtime
        run: scripts/package-insidejob.sh dist

      - name: Check public Swift client and app integration
        run: |
          source scripts/release-contract.sh
          scripts/check-insidejob-integration.py \
            "dist/$(buttonheist_insidejob_archive_name "$VERSION")" \
            ButtonHeistCLI/.build/buttonheist "$SIM_UDID"

      - name: Package binaries and scripts
        run: |
          source scripts/release-contract.sh
          CLI_ARCHIVE=$(buttonheist_cli_archive_name "$VERSION")
          MCP_ARCHIVE=$(buttonheist_mcp_archive_name "$VERSION")
          DEMO_ARCHIVE=$(buttonheist_demo_archive_name "$VERSION")
          mkdir -p dist

          # CLI + compiler artifacts
          cp ButtonHeistCLI/.build/buttonheist dist/
          mkdir -p dist/ThePlans/arm64-apple-macosx/release/Modules
          cp -R \
            .build/arm64-apple-macosx/release/ThePlans.build \
            dist/ThePlans/arm64-apple-macosx/release/
          cp \
            .build/arm64-apple-macosx/release/ThePlans.build/ThePlans.swiftinterface \
            .build/arm64-apple-macosx/release/ThePlans.build/ThePlans.private.swiftinterface \
            dist/ThePlans/arm64-apple-macosx/release/Modules/
          cp .build/arm64-apple-macosx/release/description.json \
            dist/ThePlans/arm64-apple-macosx/release/
          python3 scripts/package-licenses.py dist/Licenses \
            ButtonHeistCLI/.build/checkouts/AccessibilitySnapshotBH \
            ButtonHeistCLI/.build/checkouts/swift-argument-parser
          tar -czf "dist/${CLI_ARCHIVE}" -C dist buttonheist ThePlans Licenses
          rm dist/buttonheist
          rm -rf dist/ThePlans
          rm -rf dist/Licenses

          # MCP
          cp ButtonHeistMCP/.build/buttonheist-mcp dist/
          python3 scripts/package-licenses.py dist/Licenses \
            ButtonHeistMCP/.build/checkouts/AccessibilitySnapshotBH \
            ButtonHeistMCP/.build/checkouts/swift-sdk \
            ButtonHeistMCP/.build/checkouts/swift-system \
            ButtonHeistMCP/.build/checkouts/swift-log \
            ButtonHeistMCP/.build/checkouts/swift-nio \
            ButtonHeistMCP/.build/checkouts/swift-atomics \
            ButtonHeistMCP/.build/checkouts/swift-collections \
            ButtonHeistMCP/.build/checkouts/eventsource
          tar -czf "dist/${MCP_ARCHIVE}" -C dist buttonheist-mcp Licenses
          rm dist/buttonheist-mcp
          rm -rf dist/Licenses

          # Simulator app
          if [[ ! -d "$APP_PATH" || ! -f "$APP_PATH/Info.plist" || ! -x "$APP_PATH/BHDemo" ]]; then
            echo "::error::Refusing to package incomplete BH Demo app at $APP_PATH"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/${DEMO_ARCHIVE}"
          if ! unzip -l "dist/${DEMO_ARCHIVE}" | grep -q 'BHDemo.app/BHDemo'; then
            echo "::error::BH Demo archive is missing the app executable"
            exit 1
          fi

          # Checksums
          cd dist
          shasum -a 256 -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Smoke staged release artifacts
        run: |
          source scripts/release-contract.sh
          scripts/installed-artifact-smoke.sh \
            --cli-archive "dist/$(buttonheist_cli_archive_name "$VERSION")" \
            --mcp-archive "dist/$(buttonheist_mcp_archive_name "$VERSION")" \
            --expected-version "$VERSION" \
            --require-installed

      - name: Retain verified release archives for publication retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-release-${{ needs.admit.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Delete release simulator
        if: always() && env.SIM_NAME != ''
        run: scripts/test-runner.py cleanup --simulator-name "$SIM_NAME"

  publish:
    needs: [admit, build]
    if: >-
      !cancelled() && needs.admit.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.admit.outputs.published == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      RELEASE_SHA: ${{ needs.admit.outputs.sha }}
    steps:
      - name: Checkout protected main publication scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified archives
        if: needs.admit.outputs.published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: buttonheist-release-${{ needs.admit.outputs.sha }}
          path: dist

      - name: Publish release and Homebrew formulas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          source scripts/release-contract.sh
          git fetch --no-tags origin "$RELEASE_SHA"
          for formula in buttonheist theinsidejob; do
            git show "$RELEASE_SHA:Formula/$formula.rb" > "Formula/$formula.rb"
          done
          PARSER_TAG=$(git show "$RELEASE_SHA:Package.swift" | grep 'AccessibilitySnapshotBH' | grep -oE 'exact: "[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          PARSER_SHA=$(git ls-remote https://github.com/TheButtonHeist/AccessibilitySnapshotBH.git "refs/tags/${PARSER_TAG}^{}" | awk '{print $1}' | cut -c1-12)
          if [[ -z "$PARSER_SHA" ]]; then
            PARSER_SHA=$(git ls-remote https://github.com/TheButtonHeist/AccessibilitySnapshotBH.git "refs/tags/${PARSER_TAG}" | awk '{print $1}' | cut -c1-12)
          fi
          RELEASE_NOTES=$(mktemp)
          cat > "$RELEASE_NOTES" <<EOF
          Parser contract:
          - AccessibilitySnapshotBH: ${PARSER_TAG} (${PARSER_SHA})

          Mac Swift client: add the ButtonHeist package product at exact version ${VERSION}.
          Client setup: https://github.com/${BUTTONHEIST_GITHUB_REPO}/blob/v${VERSION}/docs/API.md#swift-client-macos

          Prebuilt Debug iOS runtime: $(buttonheist_insidejob_archive_name "$VERSION")
          Optional Homebrew install: brew install TheButtonHeist/tap/theinsidejob
          One TheInsideJob.xcframework with device and simulator slices, resources, and debug symbols (iOS 16+).
          Integration: https://github.com/${BUTTONHEIST_GITHUB_REPO}/blob/v${VERSION}/docs/PREBUILT-IOS.md
          EOF
          python3 scripts/publish-release.py "$VERSION" dist "$RELEASE_NOTES"
