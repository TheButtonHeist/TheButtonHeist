name: Verify Homebrew Tap Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-homebrew-tap-access:
    if: github.ref == 'refs/heads/main'
    name: verify-homebrew-tap-access
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout protected main workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify organization tap write access
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/verify-homebrew-tap-access.sh
