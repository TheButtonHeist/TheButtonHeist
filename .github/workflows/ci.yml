name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-contract:
    name: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run_ios_integration: ${{ steps.integration-scope.outputs.run_ios_integration }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify integration changes
        id: integration-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run_ios_integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/select-ci-change-scopes.py --github-output "$GITHUB_OUTPUT"

      - name: Validate repository contracts
        run: |
          echo "PORTABLE_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/validate-release-contract.sh

      - name: Validate adversarial automation
        run: |
          python3 scripts/check-e2e-adversarial-lab-timing.py
          python3 scripts/tests/adversarial-nightly-workflow-test.py
          python3 scripts/tests/ci-workflow-test.py
          python3 scripts/tests/e2e-adversarial-lab-test.py
          python3 scripts/tests/e2e-lifecycle-gate-test.py

      - name: Test portable automation
        run: |
          scripts/tests/check-swift-api-breaking-changes-test.sh
          scripts/tests/e2e-demo-smoke-test.sh
          scripts/tests/generate-project-test.sh
          scripts/tests/heist-doctor-from-results-test.sh
          scripts/tests/require-successful-ci-for-commit-test.sh
          python3 scripts/tests/select-ci-change-scopes-test.py
          python3 scripts/tests/select-ios-ci-simulator-test.py
          python3 scripts/tests/test-runner-test.py
          python3 scripts/tests/test-topology-test.py

      - name: Report portable contract timing
        if: success()
        run: |
          PORTABLE_END=$(date +%s)
          echo "Portable contracts: $((PORTABLE_END - PORTABLE_START))s" >> "$GITHUB_STEP_SUMMARY"

  macos-tests:
    name: macos-tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUTTONHEIST_RESULTS_MODE: failures
      BUTTONHEIST_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts/test-runs
      BUTTONHEIST_MAX_WAIT_TIMEOUT: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Classify changed paths
        if: github.event_name == 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/select-ci-change-scopes.py --github-output "$GITHUB_OUTPUT"

      - name: Select Xcode 26.6
        run: |
          echo "MAC_VALIDATION_START=$(date +%s)" >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install build tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run fast source validation
        run: |
          swiftlint lint --strict
          scripts/check-source-shape.sh

      - name: Test Bumper rules
        if: github.event_name == 'push' || steps.changes.outputs.run_bumper_rule_tests == 'true'
        run: scripts/check-source-shape.sh test

      - name: Validate Swift package products and public API
        if: github.event_name == 'push' || steps.changes.outputs.run_package_api_contracts == 'true'
        timeout-minutes: 15
        run: |
          scripts/check-swift-api-breaking-changes.sh
          scripts/check-buttonheist-import-contract.sh

      - name: Install dependencies and generate project
        timeout-minutes: 12
        run: |
          tuist install
          ./scripts/generate-project.sh --skip-install --no-binary-cache

      - name: Run macOS framework tests
        timeout-minutes: 15
        run: scripts/test-runner.py run MacFrameworkTests

      - name: Run CLI, MCP, and heist-plan tests
        if: github.event_name == 'push' || steps.changes.outputs.run_cli_tool_tests == 'true'
        timeout-minutes: 15
        env:
          HEIST_PLAN_TOOL: ${{ github.workspace }}/.build/debug/heist-plan
        run: |
          swift build --product heist-plan
          scripts/test-heist-plan-compile.sh
          scripts/swift-test-gate.sh HeistPlanTests --disable-xctest
          scripts/swift-test-gate.sh ButtonHeistCLI
          scripts/swift-test-gate.sh ButtonHeistMCP

      - name: Upload macOS failure results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_TEST_RESULTS_DIR }}
          job-label: macos-tests
          artifact-name: buttonheist-results-macos-tests-${{ github.run_attempt }}
          retention-days: 14

      - name: Report macOS validation timing
        if: success()
        run: |
          MAC_VALIDATION_END=$(date +%s)
          echo "Consolidated macOS validation: $((MAC_VALIDATION_END - MAC_VALIDATION_START))s" \
            >> "$GITHUB_STEP_SUMMARY"

  ios-logic:
    name: ios-logic
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 50
    env:
      BUTTONHEIST_RESULTS_MODE: failures
      BUTTONHEIST_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts/test-runs
      BUTTONHEIST_TEST_SIMULATOR_NAME: buttonheist-ci-logic-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install Tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Install dependencies and generate project
        timeout-minutes: 12
        run: |
          tuist install
          ./scripts/generate-project.sh --skip-install --no-binary-cache

      - name: Build deterministic iOS logic
        timeout-minutes: 20
        run: |
          echo "IOS_LOGIC_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py build-for-testing TheInsideJobLogicTests --retain-simulator
          echo "IOS_LOGIC_BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run deterministic iOS logic
        timeout-minutes: 18
        run: |
          echo "IOS_LOGIC_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py test-without-building TheInsideJobLogicTests --retain-simulator
          echo "IOS_LOGIC_RUN_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Delete dedicated iOS simulator
        if: always()
        run: scripts/test-runner.py cleanup

      - name: Upload logic failure results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_TEST_RESULTS_DIR }}
          job-label: ios-logic
          artifact-name: buttonheist-results-ios-logic-${{ github.run_attempt }}
          retention-days: 14

      - name: Upload logic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-ios-logic-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.BUTTONHEIST_TEST_RESULT_BUNDLE }}
            ${{ env.BUTTONHEIST_TEST_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Report iOS logic timings
        if: success()
        run: |
          {
            echo "## iOS Logic Timings"
            echo "- Build: $((IOS_LOGIC_BUILD_END - IOS_LOGIC_BUILD_START))s"
            echo "- Run: $((IOS_LOGIC_RUN_END - IOS_LOGIC_RUN_START))s"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-hosted:
    name: ios-hosted
    needs: ios-logic
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 80
    env:
      BUTTONHEIST_RESULTS_MODE: failures
      BUTTONHEIST_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts/test-runs
      BUTTONHEIST_TEST_SIMULATOR_NAME: buttonheist-ci-hosted-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install Tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Install dependencies and generate project
        timeout-minutes: 12
        run: |
          tuist install
          ./scripts/generate-project.sh --skip-install --no-binary-cache

      - name: Build hosted behavior once
        timeout-minutes: 20
        run: |
          echo "HOSTED_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py build-for-testing HostedBehaviorTests --retain-simulator
          echo "HOSTED_BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build ButtonHeist CLI
        timeout-minutes: 8
        run: swift build --package-path ButtonHeistCLI

      - name: Run foreground window tests
        timeout-minutes: 15
        run: |
          echo "WINDOW_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py test-without-building TheInsideJobWindowTests --retain-simulator
          echo "WINDOW_RUN_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run hosted behavior contracts
        timeout-minutes: 15
        run: |
          echo "HOSTED_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py test-without-building HostedBehaviorTests --retain-simulator
          echo "HOSTED_RUN_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run trimmed BH Demo smoke
        timeout-minutes: 10
        run: |
          echo "IOS_DEMO_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          APP="$BUTTONHEIST_TEST_DERIVED_DATA/Build/Products/Debug-iphonesimulator/BHDemo.app"
          scripts/run-with-heist-results.sh \
            --dir "$BUTTONHEIST_TEST_RESULTS_DIR" \
            --mode "$BUTTONHEIST_RESULTS_MODE" \
            -- scripts/e2e-demo-smoke.py \
            --skip-generate \
            --skip-cli-build \
            --sim-udid "$SIM_UDID" \
            --app "$APP"
          echo "IOS_DEMO_RUN_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Delete dedicated iOS simulator
        if: always()
        run: scripts/test-runner.py cleanup

      - name: Upload window failure results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/TheInsideJobWindowTests/heist-results
          job-label: ios-window
          artifact-name: buttonheist-results-ios-window-${{ github.run_attempt }}
          retention-days: 14

      - name: Upload hosted behavior failure results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/HostedBehaviorTests/heist-results
          job-label: ios-hosted
          artifact-name: buttonheist-results-ios-hosted-${{ github.run_attempt }}
          retention-days: 14

      - name: Upload hosted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-ios-hosted-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/TheInsideJobWindowTests/result-bundles
            ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/TheInsideJobWindowTests/diagnostics
            ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/HostedBehaviorTests/result-bundles
            ${{ env.BUTTONHEIST_TEST_ARTIFACTS_DIR }}/HostedBehaviorTests/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Report hosted timings
        if: success()
        run: |
          {
            echo "## Hosted Timings"
            echo "- Build: $((HOSTED_BUILD_END - HOSTED_BUILD_START))s"
            echo "- Window: $((WINDOW_RUN_END - WINDOW_RUN_START))s"
            echo "- Behavior: $((HOSTED_RUN_END - HOSTED_RUN_START))s"
            echo "- Demo smoke: $((IOS_DEMO_RUN_END - IOS_DEMO_RUN_START))s"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-integration:
    name: ios-integration
    needs: [ios-logic, release-contract]
    if: always() && needs.ios-logic.result == 'success' && needs.release-contract.outputs.run_ios_integration == 'true'
    runs-on: macos-26
    timeout-minutes: 65
    env:
      BUTTONHEIST_RESULTS_MODE: failures
      BUTTONHEIST_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts/test-runs
      BUTTONHEIST_TEST_SIMULATOR_NAME: buttonheist-ci-integration-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install Tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Install dependencies and generate project
        timeout-minutes: 12
        run: |
          tuist install
          ./scripts/generate-project.sh --skip-install --no-binary-cache

      - name: Build integration suite
        timeout-minutes: 20
        run: |
          echo "INTEGRATION_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py build-for-testing TheInsideJobIntegrationTests --retain-simulator
          echo "INTEGRATION_BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run genuine iOS integration suite
        timeout-minutes: 18
        run: |
          echo "INTEGRATION_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          scripts/test-runner.py test-without-building TheInsideJobIntegrationTests --retain-simulator
          echo "INTEGRATION_RUN_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Delete dedicated iOS simulator
        if: always()
        run: scripts/test-runner.py cleanup

      - name: Upload integration failure results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_TEST_RESULTS_DIR }}
          job-label: ios-integration
          artifact-name: buttonheist-results-ios-integration-${{ github.run_attempt }}
          retention-days: 14

      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-ios-integration-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.BUTTONHEIST_TEST_RESULT_BUNDLE }}
            ${{ env.BUTTONHEIST_TEST_DIAGNOSTICS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Report integration timings
        if: success()
        run: |
          {
            echo "## iOS Integration Timings"
            echo "- Build: $((INTEGRATION_BUILD_END - INTEGRATION_BUILD_START))s"
            echo "- Run: $((INTEGRATION_RUN_END - INTEGRATION_RUN_START))s"
          } >> "$GITHUB_STEP_SUMMARY"

  exact-sha-suite:
    name: exact-sha-suite
    needs: [release-contract, macos-tests, ios-logic, ios-hosted, ios-integration]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.sha }}

      - name: Record exact-SHA suite manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_CONTRACT: ${{ needs.release-contract.result }}
          MACOS_TESTS: ${{ needs.macos-tests.result }}
          IOS_TESTS: ${{ needs.ios-logic.result }}
          IOS_DEMO_GATES: ${{ needs.ios-hosted.result }}
          MAIN_INTEGRATION: ${{ needs.ios-integration.result }}
        run: |
          jq -n \
            --arg commit "$COMMIT_SHA" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg runId "$RUN_ID" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg releaseContract "$RELEASE_CONTRACT" \
            --arg macosTests "$MACOS_TESTS" \
            --arg iosTests "$IOS_TESTS" \
            --arg iosDemoGates "$IOS_DEMO_GATES" \
            --arg mainIntegration "$MAIN_INTEGRATION" \
            '{
              schemaVersion: 1,
              commit: $commit,
              workflow: {
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              },
              suites: [
                {name: "release-contract", conclusion: $releaseContract},
                {name: "macos-tests", conclusion: $macosTests},
                {name: "ios-tests", conclusion: $iosTests},
                {name: "ios-demo-gates", conclusion: $iosDemoGates},
                {name: "main-integration", conclusion: $mainIntegration}
              ]
            }' > exact-sha-suite.json

      - name: Upload exact-SHA suite manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-exact-sha-suite
          path: exact-sha-suite.json
          if-no-files-found: error
          retention-days: 14

      - name: Require every release suite
        env:
          COMMIT_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -e \
            --arg commit "$COMMIT_SHA" \
            --arg workflowRef "$EXPECTED_WORKFLOW_REF" \
            --arg runId "$RUN_ID" \
            -f scripts/exact-sha-suite.jq \
            exact-sha-suite.json
