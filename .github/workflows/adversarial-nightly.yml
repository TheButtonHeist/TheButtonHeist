name: Adversarial Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      passing_repeat_count:
        description: Passing scenario repeat count
        required: false
        default: "5"

concurrency:
  group: adversarial-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-nightly:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 65
    env:
      DERIVED_DATA_PATH: /tmp/ButtonHeistDerivedData-adversarial
      BUTTONHEIST_TEST_SIMULATOR_NAME: buttonheist-ci-adversarial-${{ github.run_id }}-${{ github.run_attempt }}
      BUTTONHEIST_ADVERSARIAL_REPEAT_COUNT: ${{ github.event.inputs.passing_repeat_count || '5' }}
      BUTTONHEIST_RESULTS_DIR: ${{ github.workspace }}/ci-artifacts/buttonheist-results/adversarial-nightly
      BUTTONHEIST_RESULTS_MODE: failures

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Boot simulator in background
        run: |
          scripts/test-runner.py prepare-simulator \
            --simulator-name "$BUTTONHEIST_TEST_SIMULATOR_NAME"
          # Boot continues asynchronously while dependencies install.

      - name: Install Tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4

      - name: Install Tuist dependencies
        timeout-minutes: 12
        run: tuist install

      - name: Generate project
        timeout-minutes: 5
        run: ./scripts/generate-project.sh --skip-install --no-binary-cache

      - name: Build BH Demo
        timeout-minutes: 12
        run: |
          DEST="platform=iOS Simulator,id=$SIM_UDID,arch=arm64"
          xcodebuild -workspace ButtonHeist.xcworkspace -scheme "BH Demo" \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            build

      - name: Build ButtonHeist CLI
        timeout-minutes: 8
        run: swift build --package-path ButtonHeistCLI

      - name: Run adversarial lab
        timeout-minutes: 40
        run: |
          APP="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/BHDemo.app"
          scripts/run-with-heist-results.sh \
            --dir "$BUTTONHEIST_RESULTS_DIR" \
            --mode "$BUTTONHEIST_RESULTS_MODE" \
            -- python3 scripts/e2e-adversarial-lab.py \
            --sim-udid "$SIM_UDID" \
            --app "$APP" \
            --cli "$PWD/ButtonHeistCLI/.build/debug/buttonheist" \
            --repeat-count "$BUTTONHEIST_ADVERSARIAL_REPEAT_COUNT" \
            --report "$RUNNER_TEMP/buttonheist-adversarial-nightly-report.json"

      - name: Run lifecycle gate
        if: always()
        timeout-minutes: 10
        run: |
          APP="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/BHDemo.app"
          scripts/run-with-heist-results.sh \
            --dir "$BUTTONHEIST_RESULTS_DIR" \
            --mode "$BUTTONHEIST_RESULTS_MODE" \
            -- scripts/e2e-lifecycle-gate.py \
            --sim-udid "$SIM_UDID" \
            --app "$APP" \
            --cli "$PWD/ButtonHeistCLI/.build/debug/buttonheist" \
            --report "$RUNNER_TEMP/buttonheist-lifecycle-nightly-report.json"

      - name: Summarize nightly reports
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = (
              ("Adversarial lab", Path(os.environ["RUNNER_TEMP"]) / "buttonheist-adversarial-nightly-report.json"),
              ("Lifecycle gate", Path(os.environ["RUNNER_TEMP"]) / "buttonheist-lifecycle-nightly-report.json"),
          )
          lines = [
              "## Nightly test summary",
              "",
              "| Gate | Status | Requested / recorded | Classification | CLI timing (p50 / p95) |",
              "|---|---|---|---|---|",
          ]
          for label, path in reports:
              if not path.exists():
                  lines.append(f"| {label} | missing | — | infrastructure/setup failure | — |")
                  continue
              report = json.loads(path.read_text())
              status = report.get("status", "unknown")
              classification = report.get("failureKind", "none")
              if status in {"starting", "running"}:
                  classification = "infrastructure timeout/interruption"
              summary = report.get("summary", {})
              requested = summary.get("requested", "—")
              recorded = summary.get("recorded", "—")
              timing = "—"
              if label == "Adversarial lab":
                  cli_timing = report.get("summary", {}).get("cliWallDurationMs", {})
                  if cli_timing:
                      timing = f"{cli_timing.get('p50', '—')} ms / {cli_timing.get('p95', '—')} ms"
              lines.append(
                  f"| {label} | {status} | {requested} / {recorded} | {classification} | {timing} |"
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: buttonheist-nightly-reports-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buttonheist-adversarial-nightly-report.json
            ${{ runner.temp }}/buttonheist-lifecycle-nightly-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Collect nightly failure diagnostics
        if: failure()
        run: |
          mkdir -p "$BUTTONHEIST_RESULTS_DIR/diagnostics"
          for report in \
            "$RUNNER_TEMP/buttonheist-adversarial-nightly-report.json" \
            "$RUNNER_TEMP/buttonheist-lifecycle-nightly-report.json"; do
            if [[ -f "$report" ]]; then
              cp "$report" "$BUTTONHEIST_RESULTS_DIR/diagnostics/$(basename "$report")"
            fi
          done

      - name: Finalize heist results
        if: failure()
        uses: ./.github/actions/finalize-heist-results
        with:
          result-directory: ${{ env.BUTTONHEIST_RESULTS_DIR }}
          job-label: adversarial-nightly
          artifact-name: buttonheist-results-adversarial-nightly-${{ github.run_attempt }}
          retention-days: 30

      - name: Clean up adversarial simulator
        if: always()
        run: scripts/test-runner.py cleanup --simulator-name "$BUTTONHEIST_TEST_SIMULATOR_NAME"
